<!doctype html>
{% load i18n %}
<html lang="{{ LANGUAGE_CODE|default:'it' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WorkTime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <header class="p-3 bg-light mb-3">
      <div class="container d-flex justify-content-between align-items-center" style="position:relative">
        <h1 class="h4 mb-0">WorkTime</h1>
        <div style="position:absolute; right:12px; top:12px; display:flex; gap:8px; align-items:center">
          <button class="btn btn-sm" onclick="setLang('it')">🇮🇹</button>
          <button class="btn btn-sm" onclick="setLang('en')">🇬🇧</button>
        </div>
        {% if user.is_authenticated %}
          <div style="margin-left:120px">{% trans "Benvenuto" %} {{ user.email }} — <a href="{% url 'tracker:logout' %}">{% trans "Logout" %}</a></div>
        {% endif %}
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function setLang(lang){
        try{
          const csrftoken = (function(){
            const v = document.cookie.match('(^|;) ?' + 'csrftoken' + '=([^;]*)(;|$)');
            return v ? decodeURIComponent(v[2]) : null;
          })();
          const data = new URLSearchParams(); data.append('language', lang);
          await fetch('/api/set_language/', {method:'POST', headers: {'X-CSRFToken': csrftoken}, body: data, credentials:'include'})
          // reload page to apply translation in templates
          window.location.reload()
        }catch(e){ console.error(e) }
      }
    </script>
  </body>
</html>
